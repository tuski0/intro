name: fastapi-msa

services:
  user-service:
    build:
      context: ./services/user_service
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8001}:8000"
    environment:
      DATABASE_PATH: /app/data/users.db
    volumes:
      - users-data:/app/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  order-service:
    build:
      context: ./services/order_service
    ports:
      - "127.0.0.1:${ORDER_SERVICE_PORT:-8002}:8000"
    environment:
      DATABASE_PATH: /app/data/orders.db
      USER_SERVICE_URL: http://user-service:8000
    volumes:
      - orders-data:/app/data
    networks:
      - backend
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  users-data:
  orders-data:

networks:
  backend:
