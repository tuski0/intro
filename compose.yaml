services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  post-service:
    build: ./services/post-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/post_db
      COMMENT_SERVICE_URL: http://comment-service:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  comment-service:
    build: ./services/comment-service
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/comment_db
      POST_SERVICE_URL: http://post-service:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nginx: 정적 파일 서빙 + API Gateway (외부에 열리는 포트는 80 하나뿐)
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - post-service
      - comment-service
    restart: unless-stopped

volumes:
  pgdata:
